name: Apply Fragment Label v76

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-fragment-label-v76.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified patch
        run: python3 scripts/fix-fragment-label-v76.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html storage-fix.js sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: keep fragment badge label consistent"
          git push origin HEAD:main
