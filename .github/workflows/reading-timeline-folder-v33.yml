name: reading timeline folder v33

on:
  push:
    paths:
      - '.github/scripts/reading_timeline_folder_v33.py'
      - '.github/workflows/reading-timeline-folder-v33.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply timeline hierarchy refactor
        run: python .github/scripts/reading_timeline_folder_v33.py
      - name: Verify JavaScript syntax
        run: |
          node --check reading.js
          node --check reading-enhance-v3.js
          node --check reading-dialogs-v18.js
          node --check reading-pwa-v7.js
          node --check sw.js
      - name: Verify hierarchy and no duplicate delete subsystem
        run: |
          grep -F 'timeline-entry-folder' reading.js
          grep -F 'data-delete-session' reading.js
          grep -F 'data-delete-entry' reading.js
          grep -F 'deleteTimelineSession' reading.js
          grep -F 'deleteTimelineEntry' reading.js
          grep -F '.timeline-entry-list{display:grid;gap:13px}' reading.css
          grep -F '.timeline-delete-btn{' reading.css
          ! grep -F 'loadTimelineDeleteData' reading-enhance-v3.js
          ! grep -F '.rg-session-delete' reading-dialogs-v18.js
          ! grep -F 'reading-hotfix-v4.js' reading.html
          ! grep -F 'reading-hotfix-v4.js' sw.js
          test ! -f reading-hotfix-v4.js
          grep -F 'if(thought){' reading.js
          grep -F 'else if(entry.linkedFragmentId)' reading.js
          grep -F 'data-book-search-more' reading.js
          grep -F 'where("type","==","book")' reading.js
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.js reading.css reading.html reading-enhance-v3.js reading-dialogs-v18.js reading-pwa-v7.js sw.js
          git add -u reading-hotfix-v4.js
          git commit -m 'refactor: nest reading records inside sessions'
          git push origin main
