name: reading v36 session ux

on:
  push:
    paths:
      - '.github/scripts/reading_v36_session_ux.py'
      - '.github/workflows/reading-v36-session-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Reading v36 UX fixes
        run: python .github/scripts/reading_v36_session_ux.py
      - name: Verify JavaScript syntax
        run: node --check reading.js
      - name: Verify requested behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('reading.js').read_text(encoding='utf-8')
          h=Path('reading.html').read_text(encoding='utf-8')
          assert '✍' not in s and '✍' not in h
          assert '📝 필사' in h
          assert '📝 필사 원본 첨부됨' in s
          assert 'function restoreLocalReadingState(){' in s
          boot=s[s.index('async function boot(){'):]
          assert boot.index('restoreLocalReadingState()') < boot.index('await openIdb()')
          read=s[s.index('function renderRead(){'):s.index('function nextLocator',s.index('function renderRead(){'))]
          assert read.index('state.activeSession&&!state.activeSession.endedAt') < read.index('state.loading')
          assert '일시정지 중인 독서가 있어요.' in read
          assert 'Promise.all(COLLECTIONS.map' in s
          session=s[s.index('function renderEvent(ev,filter="all")'):s.index('if(ev.type==="entry")',s.index('function renderEvent(ev,filter="all")'))]
          assert session.index('session-note') < session.index('${entryFolder}')
          save=s[s.index('async function saveEntry(){'):s.index('async function deleteCurrentEntry()',s.index('async function saveEntry(){'))]
          assert 'const thoughtChanged=!previousFragmentId||thought!==previousThought;' in save
          assert 'if(thoughtChanged){' in save
          print('PASS: handwriting icon is 📝 everywhere in Reading UI')
          print('PASS: active/paused session is restored before IndexedDB/Firebase waits')
          print('PASS: remaining Reading collections load in parallel')
          print('PASS: session note renders before captured entries')
          print('PASS: Thought Garden thought-only sync boundary preserved')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.js reading.html
          git commit -m 'fix: improve Reading session resume and record layout'
          git push origin main
