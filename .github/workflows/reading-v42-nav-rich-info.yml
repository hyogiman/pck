name: reading v42 nav rich info
on:
  push:
    paths:
      - '.github/scripts/reading_v42_nav_rich_info.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Reading v42 patch
        run: python .github/scripts/reading_v42_nav_rich_info.py
      - name: Verify JavaScript syntax
        run: node --check reading.js
      - name: Verify requested behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -F '#bookDetail{z-index:35}' reading.css
          grep -F 'safeBookRichHtml' reading.js
          grep -F 'BOOK_INFO_RICH_TAGS' reading.js
          grep -F 'class="book-info-rich"' reading.js
          grep -F 'closeLayer("bookDetail")' reading.js
          grep -F './reading.css?v=20260908-reading-v42' reading.html
          grep -F './reading.js?v=20260908-reading-v42' reading.html
          ! grep -F '${esc(toc)}' reading.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.js reading.css reading.html
          git commit -m 'fix: keep Reading nav and render safe book formatting'
          git push
