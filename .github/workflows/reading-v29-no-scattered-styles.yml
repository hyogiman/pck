name: reading v29 no scattered styles

on:
  push:
    paths:
      - '.github/scripts/reading_v29_no_scattered_styles.py'
      - '.github/workflows/reading-v29-no-scattered-styles.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move all Reading visual styles to reading.css
        run: python .github/scripts/reading_v29_no_scattered_styles.py
      - name: Syntax checks
        run: |
          for f in reading*.js sw.js; do node --check "$f"; done
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.css reading.html reading*.js sw.js
          git commit -m 'refactor: remove scattered Reading Garden styles'
          git push origin main
