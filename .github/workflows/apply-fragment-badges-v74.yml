name: Apply Fragment Badge Redesign v74

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-fragment-badges-v74.yml"

permissions:
  contents: write

jobs:
  apply-badge-redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '<!-- v73: Firebase 공식 비용 구조화 진단 로그 -->',
              '<!-- v73: Firebase 공식 비용 구조화 진단 로그 -->\n  <!-- v74: Fragment badge redesign · new badges + legacy display compatibility -->',
              'version marker'
          )

          replace_once(
              '''        <select class="select" id="fragLens">
          <option value="all">전체 표시</option>
          <option value="question">❓ 질문</option>
          <option value="decision">⚖️ 결정</option>
          <option value="desire">🧭 욕망</option>
          <option value="seed">✨ 씨앗</option>
        </select>''',
              '''        <select class="select" id="fragLens">
          <option value="all">전체 표시</option>
          <optgroup label="현재 뱃지">
            <option value="discovery">👀 발견</option>
            <option value="concern">💭 고민</option>
            <option value="direction">🧭 방향</option>
            <option value="experiment">🧪 시도</option>
          </optgroup>
          <optgroup label="이전 뱃지">
            <option value="question">❓ 질문</option>
            <option value="decision">⚖️ 결정</option>
            <option value="desire">🧭 욕망</option>
            <option value="seed">✨ 씨앗</option>
          </optgroup>
        </select>''',
              'fragment lens filter'
          )

          replace_once(
              '<div class="field"><label>이 생각을 조금 더 표시해둘까요? <span style="color:var(--muted);font-weight:500">(선택하지 않아도 됩니다)</span></label>',
              '<div class="field"><label>이 생각은 지금 내게 어떤 역할을 하나요? <span style="color:var(--muted);font-weight:500">(선택하지 않아도 됩니다)</span></label>',
              'edit lens label'
          )

          replace_once(
              '''const LENSES=[
  {id:"question",e:"❓",label:"질문"},
  {id:"decision",e:"⚖️",label:"결정"},
  {id:"desire",e:"🧭",label:"욕망"},
  {id:"seed",e:"✨",label:"씨앗"}
];
/* 저장된 lenses가 없으면, 옛 type이 decision인 조각은 결정 렌즈로 '보이게'만 한다.
   (기존 데이터는 한 글자도 다시 쓰지 않는다 — 수정해서 저장할 때 비로소 lenses 필드가 생긴다) */''',
              '''const LENSES=[
  {id:"discovery",e:"👀",label:"발견"},
  {id:"concern",e:"💭",label:"고민"},
  {id:"direction",e:"🧭",label:"방향"},
  {id:"experiment",e:"🧪",label:"시도"}
];
// 이전 뱃지는 과거에 사용자가 붙인 의미를 그대로 보존하기 위한 표시·필터 전용이다.
// 새 기록이나 새 선택에는 위 LENSES만 사용하며, 기존 데이터를 일괄 변환하지 않는다.
const LEGACY_LENSES=[
  {id:"question",e:"❓",label:"질문"},
  {id:"decision",e:"⚖️",label:"결정"},
  {id:"desire",e:"🧭",label:"욕망"},
  {id:"seed",e:"✨",label:"씨앗"}
];
const ALL_LENSES=[...LENSES,...LEGACY_LENSES];
/* 저장된 lenses가 없으면, 옛 type이 decision인 조각은 결정 렌즈로 '보이게'만 한다.
   (기존 데이터는 한 글자도 다시 쓰지 않는다 — 수정해서 저장할 때 비로소 lenses 필드가 생긴다) */''',
              'lens definitions'
          )

          replace_once(
              '  const L=LENSES.find(x=>x.id===id);if(!L)return "";',
              '  const L=ALL_LENSES.find(x=>x.id===id);if(!L)return "";',
              'legacy badge display lookup'
          )

          replace_once(
              '''function renderEditLens(){
  const box=$("editLensRow");if(!box)return;
  box.innerHTML=LENSES.map(L=>`<button class="lens-chip ${state.editLens===L.id?"on":""}" data-lens-pick="${L.id}" type="button">${L.e} ${L.label}</button>`).join("");
}''',
              '''function renderEditLens(){
  const box=$("editLensRow");if(!box)return;
  const legacy=LEGACY_LENSES.find(L=>L.id===state.editLens);
  const legacyCurrent=legacy?`<button class="lens-chip on" data-lens-pick="${legacy.id}" type="button" title="예전에 선택한 뱃지입니다. 누르면 해제되고, 새 뱃지를 고르면 교체됩니다.">이전 · ${legacy.e} ${legacy.label}</button>`:"";
  box.innerHTML=legacyCurrent+LENSES.map(L=>`<button class="lens-chip ${state.editLens===L.id?"on":""}" data-lens-pick="${L.id}" type="button">${L.e} ${L.label}</button>`).join("");
}''',
              'edit lens picker'
          )

          replace_once(
              '''function poolTabs(){
  if(!state.poolThread)return "";
  return `<div class="pool-tabs">
    <button class="pool-tab ${state.poolMode==="thread"?"on":""}" data-pool-mode="thread" type="button">이 Thread ${state.poolThread.length}</button>
    <button class="pool-tab ${state.poolMode==="all"?"on":""}" data-pool-mode="all" type="button">전체 ${state.poolAll.length}</button>
    <button class="pool-tab ${state.poolMode==="seed"?"on":""}" data-pool-mode="seed" type="button">✨ 씨앗 ${state.fragments.filter(f=>effectiveLens(f)==="seed").length}</button>
  </div>`;
}
function currentPool(){
  if(state.poolMode==="seed")return state.fragments.filter(f=>effectiveLens(f)==="seed");
  return (state.poolMode==="thread"&&state.poolThread)?state.poolThread:state.poolAll;
}''',
              '''function poolTabs(){
  if(!state.poolThread)return "";
  return `<div class="pool-tabs">
    <button class="pool-tab ${state.poolMode==="thread"?"on":""}" data-pool-mode="thread" type="button">이 Thread ${state.poolThread.length}</button>
    <button class="pool-tab ${state.poolMode==="all"?"on":""}" data-pool-mode="all" type="button">전체 ${state.poolAll.length}</button>
  </div>`;
}
function currentPool(){
  return (state.poolMode==="thread"&&state.poolThread)?state.poolThread:state.poolAll;
}''',
              'studio material pool tabs'
          )

          replace_once(
              '  const seedCount=state.fragments.filter(f=>effectiveLens(f)==="seed").length;\n',
              '',
              'studio attach seed count'
          )

          replace_once(
              '''  if(tabs)tabs.innerHTML=`<div class="pool-tabs">
    ${state.attachThread?`<button class="pool-tab ${state.attachMode==="thread"?"on":""}" data-attach-mode="thread" type="button">이 Thread ${state.attachThread.length}</button>`:""}
    <button class="pool-tab ${state.attachMode==="all"?"on":""}" data-attach-mode="all" type="button">전체 ${state.attachAll.length}</button>
    ${seedCount?`<button class="pool-tab ${state.attachMode==="seed"?"on":""}" data-attach-mode="seed" type="button">✨ 씨앗 ${seedCount}</button>`:""}</div>`;''',
              '''  if(tabs)tabs.innerHTML=`<div class="pool-tabs">
    ${state.attachThread?`<button class="pool-tab ${state.attachMode==="thread"?"on":""}" data-attach-mode="thread" type="button">이 Thread ${state.attachThread.length}</button>`:""}
    <button class="pool-tab ${state.attachMode==="all"?"on":""}" data-attach-mode="all" type="button">전체 ${state.attachAll.length}</button></div>`;''',
              'studio attach tabs'
          )

          replace_once(
              '''  let pool=state.attachMode==="seed"?state.fragments.filter(f=>effectiveLens(f)==="seed")
    :(state.attachMode==="thread"&&state.attachThread)?state.attachThread:state.attachAll;''',
              '''  let pool=(state.attachMode==="thread"&&state.attachThread)?state.attachThread:state.attachAll;''',
              'studio attach pool'
          )

          # Guardrails: the semantic seed badge must now survive only in legacy compatibility/filter metadata.
          if 'data-pool-mode="seed"' in text or 'data-attach-mode="seed"' in text or 'state.poolMode==="seed"' in text or 'state.attachMode==="seed"' in text:
              raise SystemExit("seed-specific Studio behavior still remains")
          for expected in ('{id:"discovery",e:"👀",label:"발견"}', '{id:"concern",e:"💭",label:"고민"}', '{id:"direction",e:"🧭",label:"방향"}', '{id:"experiment",e:"🧪",label:"시도"}', 'const LEGACY_LENSES=['):
              if expected not in text:
                  raise SystemExit(f"missing expected badge code: {expected}")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          checks={
            'new badge picker': all(x in text for x in ['👀 발견','💭 고민','🧭 방향','🧪 시도']),
            'legacy metadata': 'const LEGACY_LENSES=[' in text and '{id:"desire",e:"🧭",label:"욕망"}' in text,
            'legacy badge renderer': 'ALL_LENSES.find' in text,
            'no Studio seed tab': 'data-pool-mode="seed"' not in text and 'data-attach-mode="seed"' not in text,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
            raise SystemExit('verification failed: '+', '.join(failed))
          print('Fragment badge redesign verified.')
          PY
      - name: Commit index update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: redesign fragment badges with legacy compatibility"
          git push origin HEAD:main
