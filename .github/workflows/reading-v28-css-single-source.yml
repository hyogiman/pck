name: reading v28 css single source

on:
  push:
    paths:
      - '.github/scripts/reading_v28_css_single_source.py'
      - '.github/workflows/reading-v28-css-single-source.yml'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate Reading Garden CSS
        run: python .github/scripts/reading_v28_css_single_source.py
      - name: Syntax checks
        run: |
          node --check reading-enhance-v3.js
          node --check reading-hotfix-v4.js
          node --check reading-genre-v5.js
          node --check reading-polish-v6.js
          node --check reading-pwa-v7.js
          node --check reading-swipe-v8.js
          node --check reading-detail-v12.js
          node --check reading-dialogs-v18.js
          node --check reading-stability-v16.js
          node --check sw.js
      - name: Verify no scattered Reading CSS
        run: |
          test "$(grep -o 'rel="stylesheet" href="./reading[^"?]*\.css' reading.html | wc -l)" -eq 1
          ! grep -R -n -E "createElement\(['\"]style['\"]\)" reading*.js
          ! grep -R -n -E "reading-(theme-v3|theme-v4|theme-v5|swipe-v8)\.css" reading.html sw.js
      - name: Commit consolidated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.css reading.html reading*.js sw.js
          git add -u reading-theme-v3.css reading-theme-v4.css reading-theme-v5.css reading-swipe-v8.css
          git commit -m 'refactor: make reading.css the single style source'
          git push origin main
