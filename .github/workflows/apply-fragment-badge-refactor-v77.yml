name: Apply Fragment Badge Refactor v77

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-fragment-badge-refactor-v77.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply verified refactor
        run: python3 scripts/refactor-fragment-badges-v77.py

      - name: Extract inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              blocks.append(body)
          if not blocks:
              raise SystemExit('no inline scripts found')
          out=Path('/tmp/thought-garden-inline')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(blocks,1):
              (out/f'inline-{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(blocks)} inline script block(s)')
          PY

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -e
          for f in /tmp/thought-garden-inline/*.js; do
            node --check "$f"
          done
          node --check storage-fix.js
          node --check sw.js

      - name: Source architecture checks
        shell: bash
        run: |
          set -e
          ! grep -Fq '이 생각을 조금 더 표시해둘까요?' index.html
          grep -Fq '이 생각은 지금 내게 어떤 역할을 하나요?' index.html
          grep -Fq 'id:"discovery",e:"👀",label:"발견"' index.html
          grep -Fq 'const LEGACY_LENSES=[' index.html
          grep -Fq 'class="helper lens-legacy-note"' index.html
          ! grep -Fq 'data-pool-mode="seed"' index.html
          ! grep -Fq 'data-attach-mode="seed"' index.html
          ! grep -Fq 'Fragment badge runtime' storage-fix.js
          ! grep -Fq '[fragment-badges-v' storage-fix.js
          grep -Fq 'garden-v24-fragment-badge-source-v77' sw.js

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html storage-fix.js sw.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor: make fragment badges source-owned"
          git push origin HEAD:main
