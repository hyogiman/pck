name: book search pagination v32

on:
  push:
    paths:
      - '.github/scripts/book_search_pagination_v32.py'
      - '.github/workflows/book-search-pagination-v32.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pagination patch
        run: python .github/scripts/book_search_pagination_v32.py
      - name: Verify syntax
        run: |
          node --check reading.js
          node --check reading-pwa-v7.js
          node --check sw.js
          node --check functions/index.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          Path('/tmp/thought-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/thought-inline.js
      - name: Verify behavior guards
        run: |
          grep -F 'req.query.page' functions/index.js
          grep -F 'searchYes24Books(query, yes24Key, page)' functions/index.js
          grep -F 'searchAladinBooks(query, aladinKey, page)' functions/index.js
          grep -F 'data-book-search-more' index.html
          grep -F 'searchBooksCombined(q,{append:true})' index.html
          grep -F 'data-book-search-more' reading.js
          grep -F 'runBookSearch({append:true})' reading.js
          grep -F 'if(thought){' reading.js
          grep -F 'else if(entry.linkedFragmentId)' reading.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/index.js index.html reading.js reading.html reading-pwa-v7.js sw.js
          git commit -m 'feat: add more results to shared book search'
          git push origin main

# one-time trigger
