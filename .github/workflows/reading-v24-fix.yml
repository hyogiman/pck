name: Reading Garden v24 stabilization

on:
  push:
    paths:
      - '.github/workflows/reading-v24-fix.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Reading Garden handwriting flow
        run: python .github/scripts/reading_v24_fix.py
      - name: Syntax check
        run: |
          node --check reading-detail-v12.js
          node --check reading-dialogs-v18.js
          node --check reading-pwa-v7.js
          node --check reading.js
      - name: Commit stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading.js reading-detail-v12.js reading-dialogs-v18.js reading-pwa-v7.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize Reading Garden handwriting save flow"
          git push
