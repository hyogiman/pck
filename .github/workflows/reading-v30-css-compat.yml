name: reading v30 css compatibility

on:
  push:
    paths:
      - '.github/scripts/reading_v30_css_compat.py'
      - '.github/workflows/reading-v30-css-compat.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply CSS compatibility cleanup
        run: python .github/scripts/reading_v30_css_compat.py
      - name: Syntax checks
        run: |
          for f in reading*.js sw.js; do node --check "$f"; done
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.css reading.html reading*.js sw.js
          git commit -m 'refactor: finalize Reading Garden single style source'
          git push origin main
