name: reading v27 delete fix

on:
  push:
    paths:
      - '.github/scripts/reading_v27_delete_fix.py'
      - '.github/workflows/reading-v27-delete-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch delete flow
        run: python .github/scripts/reading_v27_delete_fix.py
      - name: Syntax check
        run: node --check reading-hotfix-v4.js
      - name: Commit patch
        run: |
          if git diff --quiet -- reading-hotfix-v4.js; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading-hotfix-v4.js
          git commit -m 'fix: make timeline deletion actually execute'
          git push origin main
