name: reading handwriting modes v35

on:
  push:
    paths:
      - '.github/scripts/reading_handwriting_modes_v35.py'
      - '.github/workflows/reading-handwriting-modes-v35.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate handwriting save modes
        run: python .github/scripts/reading_handwriting_modes_v35.py
      - name: Verify JavaScript syntax
        run: node --check reading.js
      - name: Verify image-only path never invokes OCR
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('reading.js').read_text(encoding='utf-8')
          h=Path('reading.html').read_text(encoding='utf-8')
          start=s.index('async function saveHandwritingImageOnly(){')
          end=s.index('async function convertHandwriting(){',start)
          block=s[start:end]
          assert 'recognizeHandwritingServer' not in block
          assert 'buildHandwritingDraft()' in block
          assert 'state.handwriting.draft=d' in block
          assert 'saveHandwritingImageBtn' in h
          assert 'OCR · 텍스트 변환' in h
          assert '$("saveHandwritingImageBtn").onclick=saveHandwritingImageOnly' in s
          print('PASS: image-only mode builds/stores draft without OCR call')
          print('PASS: OCR mode remains separately available')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.js reading.html
          git commit -m 'feat: separate handwriting image-only and OCR modes'
          git push origin main
