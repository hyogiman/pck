name: reading v37 timeline scroll

on:
  push:
    paths:
      - '.github/scripts/reading_v37_timeline_scroll.py'
      - '.github/workflows/reading-v37-timeline-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Reading v37 patch
        run: python .github/scripts/reading_v37_timeline_scroll.py
      - name: Verify JavaScript syntax
        run: node --check reading.js
      - name: Verify requested behavior and boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('reading.js').read_text(encoding='utf-8')
          h=Path('reading.html').read_text(encoding='utf-8')
          assert 'sortEntriesChronologically(state.readingEntries.filter(e=>e.sessionId===s.id))' in s
          assert '이 독서시간에 남긴 기록 ${entries.length}건' in s
          assert '이 독서시간에 남긴 기록 0건' in s
          assert '<strong>${entries.length}</strong>' not in s
          assert 'history)history.scrollRestoration="manual"' in s
          assert 'function resetMainScroll(){window.scrollTo(0,0)}' in s
          setview=s[s.index('function setView(view)'):s.index('function renderAll()',s.index('function setView(view)'))]
          assert 'requestAnimationFrame(resetMainScroll)' in setview
          boot=s[s.index('async function boot(){'):]
          assert boot.index('resetMainScroll()') < boot.index('restoreLocalReadingState()')
          assert 'window.addEventListener("pageshow"' in boot
          assert './reading.js?v=20260908-reading-v37' in h
          save=s[s.index('async function saveEntry(){'):s.index('async function deleteCurrentEntry()',s.index('async function saveEntry(){'))]
          assert 'const thoughtChanged=!previousFragmentId||thought!==previousThought;' in save
          assert 'if(thoughtChanged){' in save
          print('PASS: session entries use deterministic chronological order')
          print('PASS: entry count is inline as N건')
          print('PASS: main read view resets to top on boot/pageshow/nav return')
          print('PASS: Thought Garden thought-only sync boundary preserved')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.js reading.html
          git commit -m 'fix: order Reading records and stabilize home scroll'
          git push origin main
