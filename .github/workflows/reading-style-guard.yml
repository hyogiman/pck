name: Reading Garden style guard

on:
  push:
    branches: [main]
    paths:
      - 'reading*'
      - 'sw.js'
      - 'functions/index.js'
      - 'functions/ai-v2-production-entry.js'
      - '.github/workflows/reading-style-guard.yml'
  pull_request:
    paths:
      - 'reading*'
      - 'sw.js'
      - 'functions/index.js'
      - 'functions/ai-v2-production-entry.js'
      - '.github/workflows/reading-style-guard.yml'

jobs:
  style-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify single Reading style source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_files = sorted(p.name for p in Path('.').glob('reading*.css'))
          assert css_files == ['reading.css'], f'Only reading.css is allowed; found {css_files}'

          html = Path('reading.html').read_text(encoding='utf-8')
          css = Path('reading.css').read_text(encoding='utf-8')
          links = re.findall(r'<link\s+rel="stylesheet"\s+href="\./(reading[^"?]*\.css)', html)
          assert links == ['reading.css'], f'reading.html must load only reading.css; found {links}'

          scan = [Path('reading.html'), *sorted(Path('.').glob('reading*.js'))]
          patterns = {
              'inline style attribute': re.compile(r'\bstyle\s*='),
              'dynamic style element': re.compile(r'createElement\(\s*["\']style["\']\s*\)'),
              'style property mutation': re.compile(r'\.style(?:\.|\[|\s*=)'),
              'setAttribute(style)': re.compile(r'setAttribute\(\s*["\']style["\']'),
          }
          errors=[]
          for p in scan:
              text=p.read_text(encoding='utf-8')
              for label, pattern in patterns.items():
                  m=pattern.search(text)
                  if m: errors.append(f'{p}: {label}: {m.group(0)}')
          assert not errors, 'Scattered Reading styles are forbidden:\n' + '\n'.join(errors)

          sw=Path('sw.js').read_text(encoding='utf-8')
          for old in ['reading-theme-v2.css','reading-theme-v3.css','reading-theme-v4.css','reading-theme-v5.css','reading-swipe-v8.css']:
              assert old not in html and old not in sw, f'Stale Reading CSS reference: {old}'

          # Prevent reintroducing the v29 browser-compatibility mistake.
          assert 'calc(var(--rg-level' not in css, 'Unsupported level multiplication returned to reading.css'
          assert css.count('.rg-relative-date{font-size:1rem}') == 1, 'Duplicate canonical helper returned'

          print('PASS: reading.css is the only Reading Garden CSS source')
          print('PASS: no inline/dynamic JS/HTML style declarations')
          print('PASS: no stale Reading CSS files/references')
          print('PASS: canonical progress/chart CSS uses compatible values')
          PY
      - name: Verify Reading to Thought Garden AI contract
        run: |
          python - <<'PY'
          from pathlib import Path

          js=Path('reading.js').read_text(encoding='utf-8')
          backend=Path('functions/index.js').read_text(encoding='utf-8')
          production=Path('functions/ai-v2-production-entry.js').read_text(encoding='utf-8')

          # Reading must initialize the same production callable as Thought Garden.
          assert 'firebase-functions.js' in js
          assert 'thoughtIndexCallable=httpsCallable(state.functions,"thoughtIndexFragment")' in js
          assert 'aiIndexOutbox' in js
          assert 'async function flushThoughtIndexQueue()' in js
          assert 'async function queueMissingReadingThoughtIndexes()' in js

          # Sacred boundary: the AI job is enqueued only when the user's own thought changed.
          start=js.index('const thoughtChanged=!previousFragmentId||thought!==previousThought;')
          end=js.index('}else if(previousFragmentId){', start)
          thought_block=js[start:end]
          assert 'await cloudSet("fragments",fragmentId,fragment,{silent:true});' in thought_block
          assert 'await queueThoughtIndex(fragmentId);' in thought_block
          assert js.count('await queueThoughtIndex(fragmentId);') == 1

          # Reading-only changes must never trigger a new AI analysis.
          image_start=js.index('async function saveHandwritingImageOnly()')
          image_end=js.index('async function convertHandwriting()', image_start)
          assert 'queueThoughtIndex' not in js[image_start:image_end]
          assert 'origin:"reading-garden",readingEntryId:entry.id' in thought_block

          # The deployed production entry must retain the legacy callable, and the
          # callable must meter both structured thought indexing and embeddings.
          assert '...legacy' in production
          assert 'exports.thoughtIndexFragment = onCall' in backend
          assert 'thoughtIndexGenerations: FieldValue.increment(count)' in backend
          assert 'fragmentEmbeddingCount: FieldValue.increment(1)' in backend

          print('PASS: Reading thought -> shared Fragment -> Thought Garden AI contract is intact')
          print('PASS: quote/locator/OCR/handwriting-only edits cannot retrigger Thought Garden AI')
          print('PASS: backend AI usage metering remains connected')
          PY
      - name: Verify Reading JavaScript syntax
        run: |
          for f in reading*.js sw.js; do node --check "$f"; done
