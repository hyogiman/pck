name: reading v39 medium label

on:
  push:
    paths:
      - '.github/scripts/reading_v39_medium_label.py'
      - '.github/workflows/reading-v39-medium-label.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Reading v39 patch
        run: python .github/scripts/reading_v39_medium_label.py
      - name: Verify JavaScript syntax
        run: node --check reading.js
      - name: Verify medium labels and boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('reading.js').read_text(encoding='utf-8')
          h=Path('reading.html').read_text(encoding='utf-8')
          assert 'if(format==="paper"||service==="paper")return "종이책";' in s
          assert 'if(format==="pdf")return "PDF";' in s
          assert 'if(format==="audiobook")return "오디오북";' in s
          assert 'if(service==="millie")return "밀리의 서재";' in s
          assert 'if(service==="yes24")return "YES24";' in s
          assert 'return "전자책";' in s
          assert '${esc(serviceText(ev.session))}' in s
          assert '${esc(SERVICE_LABELS[ev.session.service]||"")}' not in s
          assert './reading.js?v=20260908-reading-v39' in h
          save=s[s.index('async function saveEntry(){'):s.index('async function deleteCurrentEntry()',s.index('async function saveEntry(){'))]
          assert 'const thoughtChanged=!previousFragmentId||thought!==previousThought;' in save
          assert 'if(thoughtChanged){' in save
          print('PASS: display prioritizes reading format and ebook platform')
          print('PASS: timeline uses the unified medium label')
          print('PASS: Thought Garden thought-only sync boundary preserved')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.js reading.html
          git commit -m 'fix: show Reading medium instead of 기타'
          git push origin main
