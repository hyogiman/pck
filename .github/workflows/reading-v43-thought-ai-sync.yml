name: reading v43 thought ai sync
on:
  push:
    paths:
      - '.github/scripts/reading_v43_thought_ai_sync.py'
      - '.github/workflows/reading-v43-thought-ai-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Reading v43 patch
        run: python .github/scripts/reading_v43_thought_ai_sync.py
      - name: Verify JavaScript syntax
        run: node --check reading.js
      - name: Verify end-to-end AI bridge invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('reading.js').read_text(encoding='utf-8')
          html=Path('reading.html').read_text(encoding='utf-8')
          backend=Path('functions/index.js').read_text(encoding='utf-8')

          assert 'firebase-functions.js' in js
          assert 'const DB_VERSION=2;' in js
          assert 'aiIndexOutbox' in js
          assert 'thoughtIndexCallable=httpsCallable(state.functions,"thoughtIndexFragment")' in js
          assert 'async function flushThoughtIndexQueue()' in js
          assert 'async function queueMissingReadingThoughtIndexes()' in js
          assert 'origin:"reading-garden",readingEntryId:entry.id' in js
          assert './reading.js?v=20260908-reading-v43' in html

          # AI request must be coupled to the exact existing thoughtChanged boundary.
          start=js.index('const thoughtChanged=!previousFragmentId||thought!==previousThought;')
          end=js.index('}else if(previousFragmentId){', start)
          block=js[start:end]
          assert 'await cloudSet("fragments",fragmentId,fragment,{silent:true});' in block
          assert 'await queueThoughtIndex(fragmentId);' in block
          assert js.count('await queueThoughtIndex(fragmentId);') == 1

          # Reading-only edits must never directly enqueue Thought Garden AI.
          image_start=js.index('async function saveHandwritingImageOnly()')
          image_end=js.index('async function convertHandwriting()', image_start)
          assert 'queueThoughtIndex' not in js[image_start:image_end]

          # Offline/delete reliability.
          delete_start=js.index('async function cloudDelete(collectionName,docId)')
          delete_end=js.index('async function queueFile(file)', delete_start)
          assert 'if(collectionName==="fragments")await cancelThoughtIndex(docId);' in js[delete_start:delete_end]
          assert 'void flushThoughtIndexQueue()' in js

          # The existing production backend both exposes the callable and meters AI usage.
          assert 'exports.thoughtIndexFragment = onCall' in backend
          assert 'thoughtIndexGenerations: FieldValue.increment(count)' in backend
          assert 'fragmentEmbeddingCount: FieldValue.increment(1)' in backend
          print('PASS: save -> Fragment -> thoughtIndexFragment -> aiUsage path statically verified')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- reading.js reading.html; then
            echo 'No patch changes found' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.js reading.html
          git commit -m 'fix: index Reading Garden thoughts with Thought Garden AI'
          git push
