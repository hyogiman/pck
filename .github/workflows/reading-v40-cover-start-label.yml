name: reading v40 cover start label

on:
  push:
    paths:
      - '.github/scripts/reading_v40_cover_start_label.py'
      - '.github/workflows/reading-v40-cover-start-label.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Reading v40 patch
        run: python .github/scripts/reading_v40_cover_start_label.py
      - name: Verify JavaScript syntax
        run: |
          node --check reading.js
          node --check reading-swipe-v8.js
      - name: Verify requested behavior and style boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('reading.css').read_text(encoding='utf-8')
          js=Path('reading.js').read_text(encoding='utf-8')
          swipe=Path('reading-swipe-v8.js').read_text(encoding='utf-8')
          html=Path('reading.html').read_text(encoding='utf-8')
          assert 'width:min(48vw,220px)' in css
          assert 'object-fit:contain' in css
          assert '.hero-cover{width:min(42vw,185px)' not in css
          assert '▶ 읽기 시작 (${nextLocator(locator,p.format)})' in js
          assert '▶ 읽기 시작 (${rgNextLocator(locator,p.format)})' in swipe
          assert './reading.css?v=20260908-reading-v40' in html
          assert './reading.js?v=20260908-reading-v40' in html
          assert './reading-swipe-v8.js?v=20260908-reading-v40' in html
          save=js[js.index('async function saveEntry(){'):js.index('async function deleteCurrentEntry()',js.index('async function saveEntry(){'))]
          assert 'const thoughtChanged=!previousFragmentId||thought!==previousThought;' in save
          assert 'if(thoughtChanged){' in save
          print('PASS: cover is larger and no longer cropped by object-fit cover')
          print('PASS: resume locator follows 읽기 시작 in parentheses')
          print('PASS: single reading.css style source preserved')
          print('PASS: Thought Garden thought-only sync boundary preserved')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading.css reading.js reading-swipe-v8.js reading.html
          git commit -m 'fix: enlarge Reading cover and refine resume label'
          git push origin main
